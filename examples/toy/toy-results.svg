<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Resultados de los experimentos toy del gemelo digital previsional</title>
  <desc id="desc">Tres gráficos resumen el cambio final en tres arquetipos, la distribución para 800 personas sintéticas y la sensibilidad al calendario de transición.</desc>
  <style>
    text { font-family: Inter, Arial, sans-serif; fill: #172033; font-size: 15px; font-weight: 400; }
    .heading { font-size: 28px; font-weight: 500; }
    .subheading { font-size: 18px; font-weight: 500; }
    .small { font-size: 13px; fill: #596273; }
    .value { font-weight: 500; }
    .value-invert { fill: #ffffff; font-weight: 500; }
    .grid { stroke: #d8dde6; stroke-width: 1; }
    .axis { stroke: #596273; stroke-width: 1.2; }
    .negative { fill: #d65a52; }
    .positive { fill: #0f9f77; }
    .median { stroke: #2563eb; stroke-width: 2; stroke-dasharray: 5 4; }
    .winner-line { stroke: #2563eb; stroke-width: 3; }
    .winner-dot { fill: #2563eb; stroke: #ffffff; stroke-width: 2; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e8ecf3; }
      .small { fill: #aeb7c6; }
      .grid { stroke: #394150; }
      .axis { stroke: #aeb7c6; }
      .winner-dot { stroke: #141821; }
    }
  </style>

  <text class="heading" x="40" y="48">Experimentos toy · gemelo digital previsional</text>
  <text class="small" x="40" y="75">800 personas sintéticas · semilla 2030 · horizonte de 10 años · resultados no empíricos</text>

  <g transform="translate(40 112)">
    <text class="subheading" x="0" y="0">Cambio final en tres arquetipos (UF)</text>
    <line class="grid" x1="170" y1="32" x2="170" y2="242"/>
    <line class="grid" x1="290" y1="32" x2="290" y2="242"/>
    <line class="axis" x1="410" y1="32" x2="410" y2="242"/>
    <line class="grid" x1="470" y1="32" x2="470" y2="242"/>

    <text x="0" y="70">Joven · Fondo C</text>
    <rect class="positive" x="410" y="52" width="32.8" height="24" rx="3"/>
    <text class="value" x="450" y="70">+27,3</text>

    <text x="0" y="140">Edad media · Fondo A</text>
    <rect class="negative" x="317.8" y="122" width="92.2" height="24" rx="3"/>
    <text class="value-invert" x="402" y="140" text-anchor="end">−76,8</text>

    <text x="0" y="210">Próxima al retiro · Fondo A</text>
    <rect class="negative" x="199.6" y="192" width="210.4" height="24" rx="3"/>
    <text class="value-invert" x="402" y="210" text-anchor="end">−175,3</text>

    <line class="axis" x1="170" y1="242" x2="470" y2="242"/>
    <text class="small" x="170" y="265" text-anchor="middle">−200</text>
    <text class="small" x="290" y="265" text-anchor="middle">−100</text>
    <text class="small" x="410" y="265" text-anchor="middle">0</text>
    <text class="small" x="470" y="265" text-anchor="middle">+50</text>
  </g>

  <g transform="translate(640 112)">
    <text class="subheading" x="0" y="0">Distribución del cambio · escenario base</text>
    <line class="grid" x1="50" y1="70" x2="500" y2="70"/>
    <line class="grid" x1="50" y1="160" x2="500" y2="160"/>
    <line class="axis" x1="50" y1="250" x2="500" y2="250"/>

    <rect class="negative" x="50" y="219.6" width="27.2" height="30.4" opacity=".82"/>
    <rect class="negative" x="78.2" y="239.9" width="26.9" height="10.1" opacity=".82"/>
    <rect class="negative" x="106.1" y="229.8" width="26.9" height="20.2" opacity=".82"/>
    <rect class="negative" x="134" y="214" width="26.9" height="36" opacity=".82"/>
    <rect class="negative" x="161.9" y="216.2" width="26.9" height="33.8" opacity=".82"/>
    <rect class="negative" x="189.8" y="202.8" width="26.9" height="47.2" opacity=".82"/>
    <rect class="negative" x="217.7" y="196" width="26.9" height="54" opacity=".82"/>
    <rect class="negative" x="245.6" y="134.1" width="26.9" height="115.9" opacity=".82"/>
    <rect class="negative" x="273.5" y="115" width="26.9" height="135" opacity=".82"/>
    <rect class="negative" x="301.4" y="201.6" width="26.9" height="48.4" opacity=".82"/>
    <rect class="positive" x="329.4" y="72.2" width="26.9" height="177.8" opacity=".82"/>
    <rect class="positive" x="357.3" y="183.6" width="26.9" height="66.4" opacity=".82"/>
    <rect class="positive" x="385.2" y="212.9" width="26.9" height="37.1" opacity=".82"/>
    <rect class="positive" x="413.1" y="218.5" width="26.9" height="31.5" opacity=".82"/>
    <rect class="positive" x="441" y="230.9" width="27" height="19.1" opacity=".82"/>
    <rect class="positive" x="469" y="212.9" width="27.9" height="37.1" opacity=".82"/>

    <line class="axis" x1="335.7" y1="48" x2="335.7" y2="250"/>
    <text class="small" x="342" y="64">sin cambio</text>
    <line class="median" x1="293.6" y1="48" x2="293.6" y2="250"/>
    <text class="value" x="286" y="88" text-anchor="end">mediana −11,8 UF</text>

    <text class="small" x="50" y="273" text-anchor="middle">−80</text>
    <text class="small" x="193" y="273" text-anchor="middle">−40</text>
    <text class="small" x="335.7" y="273" text-anchor="middle">0</text>
    <text class="small" x="478.6" y="273" text-anchor="middle">+40</text>
    <text class="small" x="275" y="298" text-anchor="middle">Regla generacional − fondo observado (UF)</text>
  </g>

  <g transform="translate(40 468)">
    <text class="subheading" x="0" y="0">Sensibilidad al calendario de transición</text>

    <g transform="translate(0 35)">
      <text class="value" x="0" y="0">Cambio mediano (UF)</text>
      <line class="grid" x1="235" y1="25" x2="235" y2="235"/>
      <line class="grid" x1="364.6" y1="25" x2="364.6" y2="235"/>
      <line class="axis" x1="494.1" y1="25" x2="494.1" y2="235"/>

      <text x="0" y="72">5 años antes</text>
      <rect class="negative" x="210.2" y="54" width="283.9" height="24" rx="3"/>
      <text class="value" x="486" y="72" text-anchor="end">−21,9</text>

      <text x="0" y="142">Base</text>
      <rect class="negative" x="341.1" y="124" width="153" height="24" rx="3"/>
      <text class="value" x="486" y="142" text-anchor="end">−11,8</text>

      <text x="0" y="212">5 años después</text>
      <rect class="positive" x="494.1" y="194" width="2" height="24" rx="1"/>
      <text class="value" x="504" y="212">0,0</text>

      <text class="small" x="235" y="258" text-anchor="middle">−20</text>
      <text class="small" x="364.6" y="258" text-anchor="middle">−10</text>
      <text class="small" x="494.1" y="258" text-anchor="middle">0</text>
    </g>

    <g transform="translate(610 35)">
      <text class="value" x="0" y="0">Personas con mayor saldo (%)</text>
      <line class="grid" x1="170" y1="25" x2="170" y2="235"/>
      <line class="grid" x1="320" y1="25" x2="320" y2="235"/>
      <line class="grid" x1="470" y1="25" x2="470" y2="235"/>

      <text x="0" y="72">5 años antes</text>
      <line class="winner-line" x1="170" y1="66" x2="269.7" y2="66" opacity=".55"/>
      <circle class="winner-dot" cx="269.7" cy="66" r="6"/>
      <text class="value" x="282" y="72">16,6%</text>

      <text x="0" y="142">Base</text>
      <line class="winner-line" x1="170" y1="136" x2="329" y2="136" opacity=".55"/>
      <circle class="winner-dot" cx="329" cy="136" r="6"/>
      <text class="value" x="341" y="142">26,5%</text>

      <text x="0" y="212">5 años después</text>
      <line class="winner-line" x1="170" y1="206" x2="449.7" y2="206" opacity=".55"/>
      <circle class="winner-dot" cx="449.7" cy="206" r="6"/>
      <text class="value" x="462" y="212">46,6%</text>

      <text class="small" x="170" y="258" text-anchor="middle">0%</text>
      <text class="small" x="320" y="258" text-anchor="middle">25%</text>
      <text class="small" x="470" y="258" text-anchor="middle">50%</text>
    </g>
  </g>

  <text class="small" x="40" y="800">Ilustración metodológica: los signos dependen de esta trayectoria sintética y no son una predicción de la reforma.</text>
</svg>
