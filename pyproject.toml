[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gemelo-previsional"
version = "0.5.0"
description = "Gemelo digital previsional histórico y estocástico para Ciencia2030"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "openpyxl>=3.1",
  "pandas>=2.1",
  "lxml>=5.0",
]

[project.scripts]
gemelo-previsional = "gemelo_previsional.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
